[project]
name = "brish"
version = "0.4.1"
description = "A bridge between zsh and Python."
authors = [{ name = "NightMachinery", email = "rudiwillalwaysloveyou@gmail.com" }]
# The patched pytest (9.0.3) needs Python 3.10, and the patched Pygments
# (2.20.0, which icecream pulls in at runtime) needs 3.9, so 3.10 is the
# oldest Python the lock can cover without vulnerable versions; it is also
# the oldest one the tests run on. See docs/development.org.
requires-python = ">=3.10,<4"
dependencies = ["icecream (>=2.1.0,<3.0.0)"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/NightMachinery/brish"

[tool.poetry]
exclude = ["__pycache__"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
ipython = ">=8.10.0"
ipydex = ">=0.10.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
